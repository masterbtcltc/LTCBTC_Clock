<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>LTC • Digital Silver Supremacy</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LTC Clock">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800;900&display=swap');
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      background: #000;
      font-family: 'Exo 2', sans-serif;
      color: white;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
    }

    /* ===== HEADER ===== */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: #fff;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 14px rgba(0,0,0,0.4);
    }
    .header img {
      height: 42px;
      width: auto;
    }

    /* ===== SLIDER CONTAINER ===== */
    #slider {
      position: absolute;
      top: 64px;
      left: 0;
      width: 200%;
      height: calc(100% - 64px);
      display: flex;
      transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
      will-change: transform;
    }
    #slider.page-1 { transform: translateX(0); }
    #slider.page-2 { transform: translateX(-50%); }

    .page {
      width: 50%;
      height: 100%;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* ===== PAGE 1: CLOCK ===== */
    #page-clock {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }
    .price-line {
      font-size: clamp(42px, 11vw, 160px);
      font-weight: 800;
      letter-spacing: 2px;
      margin: 8px 0;
      color: #00A0FF;
      text-transform: uppercase;
      font-variant-numeric: normal;
      font-feature-settings: "zero" off;
      transition: all 0.3s ease;
    }
    #price-container { width: 92vw; z-index: 2; position: relative; }

    /* Floating elements (kept from original) */
    .ltc-phrase {
      position: absolute;
      max-width: 85vw;
      color: #00A0FF;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-shadow: 0 0 14px rgba(0,160,255,0.85);
      opacity: 0;
      z-index: 3;
      pointer-events: none;
      line-height: 1.3;
    }
    .ltc-logo { position: absolute; opacity: 0.05; z-index: 1; pointer-events: none; }

    /* ===== PAGE 2: PORTFOLIO ===== */
    #page-portfolio {
      background: #000;
      padding: 20px 16px 40px;
      color: white;
    }
    .portfolio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .portfolio-header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #00A0FF;
    }
    .btn {
      background: #00A0FF;
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-secondary {
      background: transparent;
      border: 2px solid #00A0FF;
      color: #00A0FF;
    }
    .total-balance {
      background: linear-gradient(135deg, #001a2e, #00335c);
      border: 1px solid #00A0FF44;
      border-radius: 16px;
      padding: 22px;
      text-align: center;
      margin-bottom: 28px;
    }
    .total-balance .label {
      font-size: 0.9rem;
      opacity: 0.7;
      margin-bottom: 6px;
    }
    .total-balance .amount {
      font-size: 2.4rem;
      font-weight: 800;
      color: #00A0FF;
    }
    .total-balance .usd {
      font-size: 1.1rem;
      opacity: 0.85;
      margin-top: 4px;
    }
    .address-list { display: flex; flex-direction: column; gap: 12px; }
    .address-card {
      background: #0a0a0a;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .address-info { flex: 1; min-width: 0; }
    .address-label {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .address-text {
      font-size: 0.78rem;
      opacity: 0.55;
      font-family: monospace;
      word-break: break-all;
    }
    .address-balance {
      text-align: right;
      font-weight: 700;
      color: #00A0FF;
      white-space: nowrap;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      opacity: 0.6;
    }
    .empty-state p { margin-bottom: 20px; }

    /* ===== SETTINGS MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #111;
      width: 100%;
      max-width: 480px;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 40px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal h2 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: #00A0FF;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      opacity: 0.8;
    }
    .form-group input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      color: white;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }
    .form-group input:focus {
      outline: none;
      border-color: #00A0FF;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .modal-actions .btn { flex: 1; }
    .saved-list { margin-top: 28px; }
    .saved-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #222;
    }
    .saved-item .info { flex: 1; min-width: 0; }
    .saved-item .label { font-weight: 600; }
    .saved-item .addr {
      font-size: 0.75rem;
      opacity: 0.5;
      font-family: monospace;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #ff4444;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* Navigation hint */
    .swipe-hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      opacity: 0.45;
      z-index: 50;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    @media (max-width: 600px) {
      .header img { height: 36px; }
      .price-line { font-size: clamp(32px, 9vw, 68px); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <img src="lilbanner.png" alt="Look Into Litecoin" />
  </header>

  <!-- Swipe container -->
  <div id="slider" class="page-1">
    
    <!-- PAGE 1: Price Clock -->
    <div class="page" id="page-clock">
      <div id="price-container">
        <div id="btc-price" class="price-line">BTC</div>
        <div id="ltc-price" class="price-line">LTC</div>
        <div id="eth-price" class="price-line">ETH</div>
        <div id="doge-price" class="price-line">DOGE</div>
        <div id="btc-ltc-ratio" class="price-line">BTCLTC</div>
        <div id="eth-ltc-ratio" class="price-line">ETHLTC</div>
        <div id="doge-ltc-ratio" class="price-line">DOGELTC</div>
        <div id="ltc-btc-ratio" class="price-line">LTCBTC</div>
        <div id="ltc-eth-ratio" class="price-line">LTCETH</div>
        <div id="ltc-doge-ratio" class="price-line">LTCDOGE</div>
      </div>
    </div>

    <!-- PAGE 2: Portfolio -->
    <div class="page" id="page-portfolio">
      <div class="portfolio-header">
        <h1>My Litecoin</h1>
        <button class="btn" id="open-settings">+ Addresses</button>
      </div>

      <div class="total-balance">
        <div class="label">Total Balance</div>
        <div class="amount" id="total-ltc">—</div>
        <div class="usd" id="total-usd">≈ $—</div>
      </div>

      <div class="address-list" id="address-list">
        <!-- filled by JS -->
      </div>
    </div>
  </div>

  <div class="swipe-hint" id="swipe-hint">← Swipe for Portfolio</div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <h2>Manage Addresses</h2>
      
      <div class="form-group">
        <label>Label (optional)</label>
        <input type="text" id="addr-label" placeholder="e.g. Cold Storage, Exchange, etc.">
      </div>
      <div class="form-group">
        <label>Litecoin Address</label>
        <input type="text" id="addr-input" placeholder="L... or M... or ltc1...">
      </div>
      
      <div class="modal-actions">
        <button class="btn btn-secondary" id="close-settings">Cancel</button>
        <button class="btn" id="save-address">Save Address</button>
      </div>

      <div class="saved-list" id="saved-list">
        <!-- filled by JS -->
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
  <script>
    // ======================
    // STATE & STORAGE
    // ======================
    const STORAGE_KEY = 'ltc_watch_addresses';
    let addresses = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let currentPage = 1;
    let ltcPriceUsd = 0;

    // ======================
    // SWIPE NAVIGATION
    // ======================
    const slider = document.getElementById('slider');
    const hint = document.getElementById('swipe-hint');
    let startX = 0;
    let startY = 0;
    let isDragging = false;

    document.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      isDragging = true;
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      if (!isDragging) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      // only horizontal swipes
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
        e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('touchend', e => {
      if (!isDragging) return;
      isDragging = false;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;

      if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;

      if (dx < 0 && currentPage === 1) {
        goToPage(2);
      } else if (dx > 0 && currentPage === 2) {
        goToPage(1);
      }
    });

    function goToPage(page) {
      currentPage = page;
      slider.className = page === 1 ? 'page-1' : 'page-2';
      hint.textContent = page === 1 ? '← Swipe for Portfolio' : 'Swipe for Clock →';
      if (page === 2) refreshBalances();
    }

    // ======================
    // SETTINGS MODAL
    // ======================
    const modal = document.getElementById('settings-modal');
    document.getElementById('open-settings').onclick = () => {
      renderSavedList();
      modal.classList.add('open');
    };
    document.getElementById('close-settings').onclick = () => modal.classList.remove('open');

    document.getElementById('save-address').onclick = () => {
      const label = document.getElementById('addr-label').value.trim() || 'Address';
      const addr = document.getElementById('addr-input').value.trim();

      if (!addr) return alert('Please enter an address');
      if (!isValidLtcAddress(addr)) return alert('That does not look like a valid Litecoin address');

      // prevent duplicates
      if (addresses.some(a => a.address.toLowerCase() === addr.toLowerCase())) {
        return alert('This address is already saved');
      }

      addresses.push({ label, address: addr });
      saveAddresses();
      document.getElementById('addr-label').value = '';
      document.getElementById('addr-input').value = '';
      renderSavedList();
      refreshBalances();
    };

    function isValidLtcAddress(addr) {
      // basic check – covers legacy, P2SH and bech32
      return /^(L|M)[a-km-zA-HJ-NP-Z1-9]{26,33}$/.test(addr) ||
             /^ltc1[a-z0-9]{39,59}$/i.test(addr);
    }

    function saveAddresses() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(addresses));
    }

    function renderSavedList() {
      const container = document.getElementById('saved-list');
      if (addresses.length === 0) {
        container.innerHTML = '<p style="opacity:0.5;margin-top:20px;">No addresses saved yet</p>';
        return;
      }
      container.innerHTML = addresses.map((a, i) => `
        <div class="saved-item">
          <div class="info">
            <div class="label">${escapeHtml(a.label)}</div>
            <div class="addr">${a.address}</div>
          </div>
          <button class="delete-btn" data-index="${i}">×</button>
        </div>
      `).join('');

      container.querySelectorAll('.delete-btn').forEach(btn => {
        btn.onclick = () => {
          addresses.splice(+btn.dataset.index, 1);
          saveAddresses();
          renderSavedList();
          refreshBalances();
        };
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ======================
    // BALANCE FETCHING
    // ======================
    async function refreshBalances() {
      const list = document.getElementById('address-list');
      
      if (addresses.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <p>No addresses added yet</p>
            <button class="btn" onclick="document.getElementById('open-settings').click()">
              Add your first address
            </button>
          </div>`;
        document.getElementById('total-ltc').textContent = '0.00 LTC';
        document.getElementById('total-usd').textContent = '≈ $0.00';
        return;
      }

      list.innerHTML = '<div style="text-align:center;padding:40px;opacity:0.6">Loading balances…</div>';

      let totalSats = 0;
      const results = [];

      for (const item of addresses) {
        try {
          // BlockCypher free endpoint (200 req/hour)
          const res = await fetch(`https://api.blockcypher.com/v1/ltc/main/addrs/${item.address}/balance`);
          if (!res.ok) throw new Error('API error');
          const data = await res.json();
          const balance = data.balance || 0; // satoshis
          results.push({ ...item, balance });
          totalSats += balance;
        } catch (err) {
          results.push({ ...item, balance: null, error: true });
        }
      }

      // get current LTC price (try from existing price elements first)
      const ltcEl = document.getElementById('ltc-price');
      if (ltcEl && ltcEl.textContent.includes('$')) {
        const match = ltcEl.textContent.match(/[\d,.]+/);
        if (match) ltcPriceUsd = parseFloat(match[0].replace(/,/g, ''));
      }
      // fallback fetch
      if (!ltcPriceUsd) {
        try {
          const p = await fetch('https://api.coinbase.com/v2/prices/LTC-USD/spot');
          const j = await p.json();
          ltcPriceUsd = parseFloat(j.data.amount);
        } catch(e) {}
      }

      const totalLtc = totalSats / 1e8;
      document.getElementById('total-ltc').textContent = totalLtc.toLocaleString(undefined, {maximumFractionDigits: 8}) + ' LTC';
      document.getElementById('total-usd').textContent = ltcPriceUsd
        ? `≈ $${(totalLtc * ltcPriceUsd).toLocaleString(undefined, {maximumFractionDigits: 2})}`
        : '≈ $—';

      list.innerHTML = results.map(r => {
        const bal = r.balance === null ? 'Error' : (r.balance / 1e8).toLocaleString(undefined, {maximumFractionDigits: 8});
        return `
          <div class="address-card">
            <div class="address-info">
              <div class="address-label">${escapeHtml(r.label)}</div>
              <div class="address-text">${r.address}</div>
            </div>
            <div class="address-balance">${bal} LTC</div>
          </div>`;
      }).join('');
    }

    // ======================
    // FLOATING LOGOS + PHRASES (original)
    // ======================
    const NUM_LOGOS = 7;
    const LOGO_SRC = 'https://cryptologos.cc/logos/litecoin-ltc-logo.svg?v=030';
    const logos = [];
    const phrases = [
      "Litecoin is the best for payments — lowest fees with the most upside.",
      "Are we all underestimating how big Litecoin is going to be?",
      "If it’s good money, just use it.",
      "Not owning Litecoin is a bet against Elon.",
      "Everyone should diversify at least 1% into Litecoin — it’s 100x undervalued.",
      "The scam is keeping people away from Litecoin.",
      "Litecoin is a better Bitcoin.",
      "Litecoin to $13K then $31K.",
      "You can’t spell inevitable without Lee.",
      "Litecoin heading to #2 market cap, then #1.",
      "LTC is so cheap here.",
      "Bitcoin dominance will fall below 30% — watch.",
      "Litecoin is the best money we have on earth.",
      "Accumulate Litecoin — it can do 100x at the drop of a hat.",
      "Everyone’s ultra bearish on Litecoin when you should be ultra bullish.",
      "Litecoin is digital silver — fast, private, and massively undervalued.",
      "Wen digital silver’s turn?",
      "Something new is cooking for Litecoin…",
      "Litecoin offers auditable supply with optional privacy via MWEB.",
      "Drivechains are coming — Litecoin will eat half the crypto market.",
      "He who folds Bitcoin-only first wins.",
      "You can’t spell believe without Lee.",
      "You can’t spell definitely without Lee.",
      "Litecoin is set to shock everyone.",
      "Historically, this is a great time to load up on Litecoin.",
      "Litecoin is at the bottom of an eight-year consolidation triangle.",
      "Bitcoin started the chapter — Litecoin writes the next one.",
      "You don’t want the hottest altcoin — you want the one that’s actually being adopted.",
      "Litecoin mining is now more profitable than Bitcoin mining.",
      "Litecoin is like silver to Bitcoin’s gold — faster and more practical.",
      "Sometimes I forget the majority on this app will eventually own Litecoin.",
      "Litecoin is that quiet giant everyone keeps sleeping on.",
      "The real alpha is switching from BTC-only to BTC + LTC.",
      "Privacy is a feature, not a bug — Litecoin has MWEB.",
      "Litecoin is the Lone Star — everything gets bigger with LTC.",
      "Do not fade this Litecoin fractal.",
      "Litecoin is the most undervalued asset in crypto history.",
      "The Litecoin ETF is already here — most people just haven’t noticed yet.",
      "Litecoin is money you can actually use.",
      "Litecoin is the cleanest shirt in the dirty laundry of crypto.",
      "One drivechain changes everything.",
      "Litecoin is phoenix den to Bitcoin's dragon den",
      "People find Litecoin and still don’t see the opportunity.",
      "This is when you go Litecoin-only.",
      "Litecoin is the original Bitcoin upgrade.",
      "The next 100x is hiding in plain sight — it’s called Litecoin.",
      "Litecoin season is closer than you think.",
      "Litecoin is the quiet king waiting to be crowned.",
      "Litecoin is inevitable.",
      "Litecoin is the future of digital money."
    ];

    function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    let phraseObj = null;

    function createLogos() {
      for (let i = 0; i < NUM_LOGOS; i++) {
        const img = document.createElement('img');
        img.src = LOGO_SRC;
        img.className = 'ltc-logo';
        const size = 80 + Math.random() * 180;
        img.style.width = size + 'px';
        document.getElementById('page-clock').appendChild(img);
        logos.push({
          el: img,
          x: Math.random() * (window.innerWidth - size),
          y: Math.random() * (window.innerHeight - size - 80),
          vx: (Math.random() * 1.4 + 0.4) * (Math.random() < 0.5 ? 1 : -1),
          vy: (Math.random() * 1.4 + 0.4) * (Math.random() < 0.5 ? 1 : -1),
          phase: Math.random() * Math.PI * 2,
          opacityBase: 0.02 + Math.random() * 0.03,
          opacityAmp: 0.04 + Math.random() * 0.05
        });
      }
    }

    function createPhrase() {
      const el = document.createElement('div');
      el.className = 'ltc-phrase';
      document.getElementById('page-clock').appendChild(el);
      phraseObj = { el, x:0, y:0, vx:0, vy:0, phase:0 };
      resetPhrase();
    }

    function resetPhrase() {
      if (!phraseObj) return;
      const el = phraseObj.el;
      el.textContent = randomFrom(phrases);
      const fontSize = 18 + Math.random() * 28;
      el.style.fontSize = fontSize + 'px';
      const w = window.innerWidth, h = window.innerHeight - 80;
      const pw = el.offsetWidth || 200, ph = el.offsetHeight || 60;
      phraseObj.x = Math.random() * Math.max(10, w - pw - 20);
      phraseObj.y = Math.random() * Math.max(10, h - ph - 20);
      phraseObj.vx = (Math.random() * 0.9 + 0.3) * (Math.random() < 0.5 ? 1 : -1);
      phraseObj.vy = (Math.random() * 0.9 + 0.3) * (Math.random() < 0.5 ? 1 : -1);
      phraseObj.phase = 0;
    }

    function animate() {
      const w = window.innerWidth, h = window.innerHeight - 80;
      logos.forEach(logo => {
        const el = logo.el;
        const lw = el.offsetWidth, lh = el.offsetHeight;
        logo.x += logo.vx; logo.y += logo.vy;
        if (logo.x <= 0 || logo.x + lw >= w) logo.vx *= -1;
        if (logo.y <= 0 || logo.y + lh >= h) logo.vy *= -1;
        logo.phase += 0.01 + Math.random() * 0.01;
        const fade = 0.5 + 0.5 * Math.sin(logo.phase);
        el.style.opacity = logo.opacityBase + logo.opacityAmp * fade;
        el.style.left = logo.x + 'px';
        el.style.top = logo.y + 'px';
      });
      if (phraseObj) {
        const el = phraseObj.el;
        const pw = el.offsetWidth || 200, ph = el.offsetHeight || 60;
        phraseObj.x += phraseObj.vx; phraseObj.y += phraseObj.vy;
        if (phraseObj.x <= 0 || phraseObj.x + pw >= w) phraseObj.vx *= -1;
        if (phraseObj.y <= 0 || phraseObj.y + ph >= h) phraseObj.vy *= -1;
        phraseObj.phase += 0.01;
        const fade = 0.5 + 0.5 * Math.sin(phraseObj.phase);
        el.style.opacity = 0.12 + 0.38 * fade;
        el.style.left = phraseObj.x + 'px';
        el.style.top = phraseObj.y + 'px';
        if (phraseObj.phase > Math.PI * 2) resetPhrase();
      }
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      logos.forEach(l => l.el.remove());
      logos.length = 0;
      createLogos();
      resetPhrase();
    });

    // Init
    createLogos();
    createPhrase();
    animate();
  </script>
</body>
</html>
