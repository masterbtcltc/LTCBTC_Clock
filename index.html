<style>
  @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800;900&display=swap');
  
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --navy: #0B2C5A;
    --navy-dark: #071E3D;
    --ltc-blue: #2E6B9E;
    --ltc-blue-bright: #3B82C4;
    --accent: #4A9BE0;
    --white: #ffffff;
    --text-muted: #94a3b8;
  }

  html, body {
    height: 100%;
    background: #000;
    font-family: 'Exo 2', sans-serif;
    color: white;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: pan-y;
  }

  /* ===== HEADER ===== */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 64px;
    background: var(--white);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 16px rgba(0,0,0,0.35);
  }
  .header img {
    height: 42px;
    width: auto;
  }

  /* ===== DESKTOP ARROWS ===== */
  .nav-arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    background: rgba(46, 107, 158, 0.18);
    border: 2px solid var(--ltc-blue);
    border-radius: 50%;
    color: var(--accent);
    font-size: 1.6rem;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 900;
    transition: all 0.2s ease;
    user-select: none;
  }
  .nav-arrow:hover {
    background: var(--ltc-blue);
    color: white;
  }
  .nav-arrow.left { left: 18px; }
  .nav-arrow.right { right: 18px; }

  @media (min-width: 768px) {
    .nav-arrow { display: flex; }
  }

  /* ===== SLIDER ===== */
  #slider {
    position: absolute;
    top: 64px;
    left: 0;
    width: 200%;
    height: calc(100% - 64px);
    display: flex;
    transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
    will-change: transform;
  }
  #slider.page-1 { transform: translateX(0); }
  #slider.page-2 { transform: translateX(-50%); }

  .page {
    width: 50%;
    height: 100%;
    position: relative;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }

  /* ===== PAGE 1: CLOCK ===== */
  #page-clock {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 12px 16px;
    text-align: center;
    background: #000;
  }

  #price-container { 
    width: 94vw; 
    max-width: 860px;
    z-index: 2; 
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .price-line {
    /* Much tighter and better controlled sizing */
    font-size: clamp(18px, 3.6vw, 42px);
    font-weight: 800;
    letter-spacing: 1.2px;
    margin: 3px 0;
    color: var(--accent);
    text-transform: uppercase;
    font-variant-numeric: normal;
    font-feature-settings: "zero" off;
    transition: color 0.2s ease;
    line-height: 1.18;
    white-space: nowrap;
  }

  @media (min-width: 900px) {
    .price-line {
      font-size: clamp(22px, 2.8vw, 38px);
      margin: 4px 0;
    }
  }

  @media (min-width: 1400px) {
    .price-line {
      font-size: 36px;
    }
  }

  @media (hover: hover) and (pointer: fine) {
    .price-line:hover { 
      color: #6bb3f0;
    }
  }

  .ltc-phrase {
    position: absolute;
    max-width: 85vw;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 1.3px;
    text-shadow: 0 0 14px rgba(74, 155, 224, 0.7);
    opacity: 0;
    z-index: 3;
    pointer-events: none;
    line-height: 1.3;
  }
  .ltc-logo { position: absolute; opacity: 0.045; z-index: 1; pointer-events: none; }

  /* ===== PAGE 2: PORTFOLIO ===== */
  #page-portfolio {
    background: #05080f;
    padding: 20px 16px 50px;
    color: white;
  }
  .portfolio-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .portfolio-header h1 {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--accent);
    margin: 0;
  }
  .header-buttons {
    display: flex;
    gap: 10px;
  }
  .btn {
    background: var(--ltc-blue);
    color: white;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--ltc-blue-bright); }
  .btn-secondary {
    background: transparent;
    border: 2px solid var(--ltc-blue);
    color: var(--accent);
  }
  .btn-secondary:hover {
    background: rgba(46, 107, 158, 0.25);
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .total-balance {
    background: linear-gradient(145deg, var(--navy-dark), var(--navy));
    border: 1px solid rgba(74, 155, 224, 0.35);
    border-radius: 16px;
    padding: 22px;
    text-align: center;
    margin-bottom: 26px;
  }
  .total-balance .label {
    font-size: 0.9rem;
    opacity: 0.75;
    margin-bottom: 6px;
    color: #c5d4e8;
  }
  .total-balance .amount {
    font-size: 2.1rem;
    font-weight: 800;
    color: var(--accent);
  }
  .total-balance .usd {
    font-size: 1.05rem;
    opacity: 0.85;
    margin-top: 4px;
    color: #b8cce0;
  }
  .address-list { display: flex; flex-direction: column; gap: 12px; }
  .address-card {
    background: #0c1220;
    border: 1px solid #1a2740;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .address-info { flex: 1; min-width: 0; }
  .address-label {
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #e2eaf5;
  }
  .address-text {
    font-size: 0.78rem;
    opacity: 0.55;
    font-family: monospace;
    word-break: break-all;
    color: #94a3b8;
  }
  .address-balance {
    text-align: right;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    opacity: 0.65;
    color: #94a3b8;
  }
  .empty-state p { margin-bottom: 20px; }

  /* ===== SETTINGS MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 2000;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #0c1220;
    width: 100%;
    max-width: 480px;
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 40px;
    max-height: 88vh;
    overflow-y: auto;
    border-top: 1px solid #1e3a5f;
  }
  .modal h2 {
    font-size: 1.35rem;
    margin-bottom: 18px;
    color: var(--accent);
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 6px;
    color: #94a3b8;
  }
  .form-group input {
    width: 100%;
    background: #111827;
    border: 1px solid #1e3a5f;
    color: white;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--ltc-blue);
  }
  .modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .modal-actions .btn { flex: 1; }
  .saved-list { margin-top: 28px; }
  .saved-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #1a2740;
  }
  .saved-item .info { flex: 1; min-width: 0; }
  .saved-item .label { font-weight: 600; color: #e2eaf5; }
  .saved-item .addr {
    font-size: 0.75rem;
    opacity: 0.55;
    font-family: monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #94a3b8;
  }
  .delete-btn {
    background: none;
    border: none;
    color: #f87171;
    font-size: 1.4rem;
    cursor: pointer;
    padding: 4px 8px;
  }

  .swipe-hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    opacity: 0.4;
    z-index: 50;
    pointer-events: none;
    color: #94a3b8;
  }

  /* Mobile */
  @media (max-width: 600px) {
    .header img { height: 36px; }
    .price-line { 
      font-size: clamp(16px, 5.8vw, 28px);
      margin: 2px 0;
    }
  }
</style>
